# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 程序员老白
subtitle: '企业数字化产品设计 · 系统架构 · PMP方法论实践'
description: '聚焦企业级数字化项目设计与项目管理方法论落地，分享PMP/ACP实践、系统架构、全栈技术与产品工程经验。'
keywords: 项目管理,PMP,ACP,产品设计,系统架构,Java,Vue,前端,微信小程序,数字化转型
author: 程序员老白
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://baininghan.github.io
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: false
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: true
  preprocess: false   # 关掉服务端预处理，让 hexo-filter-mermaid-diagrams 先处理 ```mermaid 代码块
  line_number: false
  tab_replace: ''

# 文章搜索
search:
  path: search.xml
  field: post
# 中文链接转拼音
permalink_pinyin:
  enable: true
  separator: '-' # default: '-'
# emoji表情支持
githubEmojis:
  enable: true
  className: github-emoji
  inject: true
  styles:
  customEmojis:

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: hexo-theme-matery

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
- type: git
  repo: git@github.com:baininghan/baininghan.github.io.git
  branch: gh-pages
- type: git
  repo: git@gitee.com:baininghan/baininghan.gitee.io.git
  branch: gh-pages

## git-backup
backup:
  type: git
  repository:
    github: git@github.com:baininghan/baininghan.github.io.git,main
    gitee: git@gitee.com:baininghan/baininghan.gitee.io.git,master

# abbrlink 短链接（基于 title+date 生成稳定 hash，URL 永不失效）
abbrlink:
  alg: crc32   # crc16 / crc32
  rep: hex     # dec / hex
  drafts: false

# mermaid 渲染（hexo-filter-mermaid-diagrams 插件）
mermaid:
  enable: true
  version: '10.9.1'   # 最新稳定版，支持 gantt/sequence/class/state 等
  options:
    theme: 'forest'   # 可选：default / forest / dark / neutral
